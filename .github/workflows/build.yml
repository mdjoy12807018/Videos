name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Locate Project Root and Install Dependencies
        run: |
          PROJECT_PATH=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          echo "Found project at: $PROJECT_PATH"
          cd $PROJECT_PATH
          flutter pub get

      - name: Build APK
        run: |
          PROJECT_PATH=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          cd $PROJECT_PATH
          flutter build apk --release
