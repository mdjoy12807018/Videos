name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Absolute Automated Build Fix
        run: |
          # 1. Ensure pubspec.yaml has valid environment SDK constraint
          PUBSPEC_PATH="pubspec.yaml"
          if [ -f "$PUBSPEC_PATH" ]; then
            if ! grep -q "environment:" "$PUBSPEC_PATH"; then
              echo "" >> "$PUBSPEC_PATH"
              echo "environment:" >> "$PUBSPEC_PATH"
              echo "  sdk: '>=3.0.0 <4.0.0'" >> "$PUBSPEC_PATH"
            fi
          fi

          # 2. Self-generate missing Android platform structure and v2 embedding manifest
          mkdir -p android/app/src/main
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.videos">' > "$MANIFEST_PATH"
            echo '    <application android:label="videos" android:name="${applicationName}" android:icon="@mipmap/ic_launcher">' >> "$MANIFEST_PATH"
            echo '        <meta-data android:name="flutterEmbedding" android:value="2" />' >> "$MANIFEST_PATH"
            echo '    </application>' >> "$MANIFEST_PATH"
            echo '</manifest>' >> "$MANIFEST_PATH"
          else
            if ! grep -q "flutterEmbedding" "$MANIFEST_PATH"; then
              sed -i '/<application/a \        <meta-data\n            android:name=\"flutterEmbedding\"\n            android:value=\"2\" \/>' "$MANIFEST_PATH"
            fi
          fi

          # 3. Clean fetch and build release APK with failsafe options
          flutter pub get
          flutter build apk --release
