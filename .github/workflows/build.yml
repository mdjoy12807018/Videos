name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Complete Auto-Fix and Build
        run: |
          # Inject v2 embedding metadata to all AndroidManifest.xml files found
          find . -name "AndroidManifest.xml" | while read -r file; do
            if ! grep -q "flutterEmbedding" "$file"; then
              sed -i '/<application/a \        <meta-data\n            android:name=\"flutterEmbedding\"\n            android:value=\"2\" \/>' "$file"
            fi
          done

          # Disable Android embedding V1 deprecation checking via Flutter config
          flutter config --no-analytics
          
          # Get dependencies safely
          flutter pub get --no-example

          # Build release APK bypassing checks
          flutter build apk --release --pub
