name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Fresh Flutter Project and Copy Code
        run: |
          flutter create . --org com.example.videoapp --project-name videos

      - name: Add Dependencies Properly to pubspec.yaml
        run: |
          sed -i '/dependencies:/a \  firebase_core: ^2.27.0\n  firebase_auth: ^4.17.8\n  cloud_firestore: ^4.15.8\n  firebase_storage: ^11.6.9\n  file_picker: ^8.0.0\n  video_player: ^2.8.2' pubspec.yaml
          flutter pub get

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
