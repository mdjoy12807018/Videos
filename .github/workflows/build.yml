name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Fresh Recreate and Build APK
        run: |
          # Remove old corrupted android/ios folders if they exist
          rm -rf android ios

          # Create a completely fresh Flutter project structure keeping lib/ and pubspec.yaml safe
          flutter create . --org com.example.videos --project-name videos

          # Ensure v2 embedding metadata is present in AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "flutterEmbedding" "$MANIFEST_PATH"; then
              sed -i '/<application/a \        <meta-data\n            android:name=\"flutterEmbedding\"\n            android:value=\"2\" \/>' "$MANIFEST_PATH"
            fi
          fi

          # Get dependencies and build the release APK successfully
          flutter pub get
          flutter build apk --release
