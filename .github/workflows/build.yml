name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Generate Platform and Build APK
        run: |
          # Check if android folder exists, if not or broken, generate it cleanly using flutter create
          if [ ! -d "android" ] || [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            flutter create . --platforms=android --org com.example.videos --project-name videos
          fi

          # Force inject v2 embedding metadata to ensure no migration error
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "flutterEmbedding" "$MANIFEST_PATH"; then
              sed -i '/<application/a \        <meta-data\n            android:name=\"flutterEmbedding\"\n            android:value=\"2\" \/>' "$MANIFEST_PATH"
            fi
          fi

          # Get dependencies and build release APK safely
          flutter pub get
          flutter build apk --release
