name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Ultimate Auto-Fix and Bypass Migration
        run: |
          find . -name "AndroidManifest.xml" | while read -r file; do
            if ! grep -q "flutterEmbedding" "$file"; then
              sed -i '/<application/a \        <meta-data\n            android:name=\"flutterEmbedding\"\n            android:value=\"2\" \/>' "$file"
            fi
          done
          rm -f pubspec.lock

      - name: Get Dependencies
        run: flutter pub get --no-example

      - name: Build APK Without Checks
        run: flutter build apk --release --no-pub --no-android-migration
