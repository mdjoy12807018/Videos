name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Safe Ultimate Build Fix
        run: |
          # Safely create android directory only if it completely misses, without touching lib/
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.example.videos --project-name videos
          fi

          # Ensure AndroidManifest.xml has v2 embedding metadata
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "flutterEmbedding" "$MANIFEST_PATH"; then
              sed -i '/<application/a \        <meta-data\n            android:name=\"flutterEmbedding\"\n            android:value=\"2\" \/>' "$MANIFEST_PATH"
            fi
          fi

          # Fetch all pubspec dependencies properly
          flutter pub get

          # Build release APK
          flutter build apk --release
