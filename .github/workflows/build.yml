name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Force Fix Android Embedding and Build
        run: |
          # Create AndroidManifest.xml with v2 embedding if it doesn't exist in the correct path
          mkdir -p android/app/src/main
          
          # If AndroidManifest.xml exists anywhere, patch it, otherwise create a base one with v2 embedding
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            if ! grep -q "flutterEmbedding" "android/app/src/main/AndroidManifest.xml"; then
              sed -i '/<application/a \        <meta-data\n            android:name=\"flutterEmbedding\"\n            android:value=\"2\" \/>' "android/app/src/main/AndroidManifest.xml"
            fi
          else
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.videos">' > android/app/src/main/AndroidManifest.xml
            echo '    <application android:label="videos" android:name="${applicationName}" android:icon="@mipmap/ic_launcher">' >> android/app/src/main/AndroidManifest.xml
            echo '        <meta-data android:name="flutterEmbedding" android:value="2" />' >> android/app/src/main/AndroidManifest.xml
            echo '    </application>' >> android/app/src/main/AndroidManifest.xml
            echo '</manifest>' >> android/app/src/main/AndroidManifest.xml
          fi

          # Clean lock file and get dependencies
          rm -f pubspec.lock
          flutter pub get || true

          # Build APK
          flutter build apk --release --no-pub
